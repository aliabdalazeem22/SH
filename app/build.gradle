plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.example.swiftshare'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.swiftshare'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        compose true
    }

    lint {
        // Arabic is the default resource language (values/), English lives in
        // values-en/. This is intentional, but lint assumes values/ is a
        // developer-language fallback and reports every Arabic string as
        // "missing" from an ar folder. Runtime resource resolution still falls
        // back to values/ for Arabic devices, so the check is a false positive.
        disable 'MissingTranslation'
        // Warnings are reported in the lint output but do not fail the build.
        abortOnError true
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1,LGPL3.0,LICENSE,NOTICE}.txt'
            excludes += '/META-INF/versions/9-*/**/*.class'
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material:material'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.core:core-ktx:1.15.0'
    // Pulled in at 1.0.0 transitively by Play Services; the Activity Result APIs
    // require >= 1.3.0 for correct onRequestPermissionsResult dispatch.
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'com.google.android.gms:play-services-nearby:19.1.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
}
